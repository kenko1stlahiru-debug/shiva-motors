<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHIVA MOTORS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shiva Motors">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e2e0da;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#f1f0ec;--mut:#9a9a93;--bd:#34332f;--ac:#fb923c;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#f1f0ec;--mut:#9a9a93;--bd:#34332f;--ac:#fb923c;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans Sinhala","Iskoola Pota",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.5px}h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
nav{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
nav button,.seg button{flex:1;white-space:nowrap;padding:9px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on,.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{font-size:12px;color:var(--mut)}.v{font-size:17px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.seg{display:flex;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.save{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px}
.hide{display:none}.msg{padding:10px;border-radius:10px;background:var(--card);border:1px dashed var(--bd);color:var(--mut);margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
.wrap{padding-bottom:96px}
.top{display:flex;align-items:center;gap:12px;padding:16px;margin:4px 0 14px;border-radius:18px;background:linear-gradient(135deg,#111827,#1f2937 60%,#7c2d12);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.logo{width:46px;height:46px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-weight:800;letter-spacing:1px;color:#fff;flex:none}
.top h1{margin:0;font-size:19px;letter-spacing:2px;color:#fff}.top h1 span{color:#fb923c}
.top .sub{margin:2px 0 0;color:#cbd5e1;font-size:12px}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-color:var(--bd)}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
.grid{gap:10px}.grid>div{min-width:0;padding:10px;border-radius:12px;background:var(--bg);border-top:3px solid var(--bd)}
.grid>div:nth-child(1){border-top-color:var(--ok)}.grid>div:nth-child(2){border-top-color:var(--bad)}.grid>div:nth-child(3){border-top-color:var(--ac)}
.v{font-size:15px;word-break:break-word}
nav{position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;background:var(--card);border-top:1px solid var(--bd);z-index:20;overflow:visible}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:11px;padding:6px 2px;border-radius:10px}
nav button.on{background:none;color:var(--ac);font-weight:700}
nav button *{pointer-events:none}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0;border-color:transparent}
.save{box-shadow:0 4px 12px rgba(194,65,12,.3)}
.row{align-items:center}
#status{border-radius:12px}
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#111827,#1f2937 65%,#7c2d12);display:grid;place-items:center;padding:20px}
#login form{width:100%;max-width:340px;background:var(--card);border-radius:18px;padding:22px}
#login .logo{margin:0 auto 10px;width:56px;height:56px}#login h2{text-align:center;margin:0 0 6px;font-size:18px;letter-spacing:2px}
#lerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px;text-align:center}

#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
#m.on{display:flex}
.sh{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.chip{flex:1;padding:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
.row b{white-space:nowrap}
</style></head><body>
<datalist id="dl_cust"></datalist><datalist id="dl_veh"></datalist>
<div id="login" style="display:none"><form id="lf"><div class="logo">SM</div><h2>SHIVA MOTORS</h2><label>PIN</label><input type="password" id="lp" inputmode="numeric" autocomplete="off"><button class="save" type="submit">ඇතුළු වන්න</button><div id="lerr"></div></form></div>
<div class="wrap"><header class="top"><div class="logo">SM</div><div><h1>SHIVA <span>MOTORS</span></h1><div class="sub">Garage Accounts &amp; Customer Records</div></div></header><div id="app"></div></div>
<nav id="nav">
<button data-t="home"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>සාරාංශය</span></button>
<button data-t="jobs"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 6H5v15h14V6h-2M8 12h8M8 16h5"/></svg><span>වැඩ</span></button>
<button data-t="staff"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3.2-6 6.5-6s6 2 6.5 6M17 11a3 3 0 100-6M18 14c2.2.4 3.5 2.3 3.8 5"/></svg><span>ස්ටාෆ්</span></button>
<button data-t="exp"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2"/></svg><span>වියදම්</span></button>
<button data-t="more"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg><span>තව</span></button></nav>
<div id="m"></div>
<script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>"Rs. "+Math.round(n||0).toLocaleString("en-US"),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const K="shiva-motors-v2",CATS={parts:"වාහන කොටස්",food:"ස්ටාෆ් කෑම බීම",wage:"ස්ටාෆ් පඩි / ඇඩ්වාන්ස්",bills:"කුලී / විදුලි / වතුර",other:"වෙනත්",draw:"අයිතිකරුගේ ගැනීම් (අනිත් වාහන / ගෙදර)"};
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
["jobs","exp","staff","att"].forEach(k=>S[k]=S[k]||{});S.pin=S.pin||"";
let M=today().slice(0,7),T="home",Q="";
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("ෆෝන් එකේ ගබඩා කළ නොහැකි විය. Storage පිරී ඇත.")}};
const L=c=>Object.entries(S[c]).map(([id,v])=>({id,...v}));
const put=(c,id,v)=>{S[c][id||uid()]=v;save();R()},rm=(c,id)=>{delete S[c][id];save();R()};
const paid=j=>(j.pays||[]).reduce((a,p)=>a+p.a,0),inM=d=>(d||"").slice(0,7)===M;
const cost=id=>L("exp").filter(e=>e.job===id).reduce((a,e)=>a+e.amount,0)+L("att").filter(a=>a.job===id).reduce((a,x)=>a+x.work*((S.staff[x.staff]||{}).rate||0),0);
const byNew=(a,b)=>(b.date||"").localeCompare(a.date||"");
const jobOpts=()=>[["","—"],...L("jobs").sort(byNew).slice(0,80).map(j=>[j.id,(j.veh||"")+" "+(j.cust||"")])];
const staffOpts=()=>[["","—"],...L("staff").map(s=>[s.id,s.name])];
function sheet(h){const m=$("#m");m.innerHTML='<div class="sh">'+h+"</div>";m.classList.add("on")}
const close=()=>$("#m").classList.remove("on");
$("#m").onclick=e=>{if(e.target.id==="m")close()};
function form(title,fs,v,ok,del){
 sheet(`<h3>${title}</h3>`+fs.map(f=>`<label>${f.l}</label>`+(f.t==="select"?`<select id="f_${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join("")}</select>`:`<input id="f_${f.k}" type="${f.t||"text"}"${f.list?` list="${f.list}"`:""}${f.t==="number"?' inputmode="decimal"':""}>`)).join("")+`<button class="save" id="fo">සේව් කරන්න</button>${del?'<button class="del" id="fd" style="width:100%;margin-top:10px">මකන්න</button>':""}<button class="del" id="fc" style="width:100%;margin-top:6px;color:var(--mut)">අවලංගු</button>`);
 fs.forEach(f=>{$("#f_"+f.k).value=v[f.k]??""});
 $("#fo").onclick=()=>{const o={};for(const f of fs){let x=$("#f_"+f.k).value.trim();if(f.t==="number")x=x===""?0:parseFloat(x);o[f.k]=x}if(ok(o)!==false)close()};
 $("#fc").onclick=close;if(del)$("#fd").onclick=()=>{if(confirm("මකන්නද?")){del();close()}};
}
function staffStats(){return L("staff").map(s=>{const at=L("att").filter(a=>a.staff===s.id),px=L("exp").filter(e=>e.cat==="wage"&&e.staff===s.id);
 return{...s,days:at.filter(a=>inM(a.date)).reduce((a,x)=>a+x.work,0),mpaid:px.filter(e=>inM(e.date)).reduce((a,x)=>a+x.amount,0),owed:at.reduce((a,x)=>a+x.work*s.rate,0)-px.reduce((a,x)=>a+x.amount,0)}})}
const mo=()=>`<div class="card"><input type="month" value="${M}" onchange="M=this.value||M;R()"></div>`;

function vHome(){
 const inc=L("jobs").flatMap(j=>(j.pays||[]).filter(p=>inM(p.d))).reduce((a,p)=>a+p.a,0);
 const ex=L("exp").filter(e=>inM(e.date)),by={};ex.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
 const draw=by.draw||0,out=Object.entries(by).filter(([k])=>k!=="draw").reduce((a,[,v])=>a+v,0),pf=inc-out;
 const dues=L("jobs").map(j=>({...j,bal:j.charged-paid(j)})).filter(j=>j.bal>0).sort((a,b)=>b.bal-a.bal),dt=dues.reduce((a,j)=>a+j.bal,0);
 const ss=staffStats();
 return mo()+`<div class="card"><div class="grid"><div><div class="k">ලැබුණු ආදායම</div><div class="v">${fmt(inc)}</div></div><div><div class="k">වියදම</div><div class="v">${fmt(out)}</div></div><div><div class="k">ඇත්ත ලාභය</div><div class="v ${pf>=0?"ok":"bad"}">${fmt(pf)}</div></div></div>
 <div class="row" style="margin-top:8px"><span>අයිතිකරු ගත්තේ (අනිත් වාහන / ගෙදර)</span><b>${fmt(draw)}</b></div><div class="row"><span>ව්‍යාපාරයේ ඉතුරු</span><b class="${pf-draw>=0?"ok":"bad"}">${fmt(pf-draw)}</b></div></div>
 <div class="card"><h3>වියදම් බෙදීම</h3>`+(ex.length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:8px"><div class="row" style="padding:0;border:0"><span>${CATS[k]}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/(out+draw)*100}%"></i></div></div>`).join(""):'<div class="k">වියදම් නැත</div>')+`</div>
 <div class="card"><h3>ස්ටාෆ්</h3><div class="row"><span>පඩි ලැබූ ගණන</span><b>${ss.filter(s=>s.mpaid>0).length} / ${ss.length}</b></div><div class="row"><span>මුළු පඩි</span><b>${fmt(by.wage)}</b></div><div class="row"><span>කෑම බීම</span><b>${fmt(by.food)}</b></div></div>
 <div class="card"><h3>ලැබිය යුතු මුදල්: ${fmt(dt)}</h3>`+(dues.slice(0,6).map(j=>`<div class="row" onclick="A.job('${j.id}')"><span>${esc(j.veh)} ${esc(j.cust)}</span><b class="bad">${fmt(j.bal)}</b></div>`).join("")||'<div class="k">ණය නැත</div>')+"</div>"}

function jobRows(){const q=Q.toLowerCase(),js=L("jobs").filter(j=>!q||[j.veh,j.cust,j.phone,j.desc].join(" ").toLowerCase().includes(q)).sort(byNew);
 return js.length?js.map(j=>{const b=j.charged-paid(j);return`<div class="row" onclick="A.job('${j.id}')" style="cursor:pointer"><div><b>${esc(j.veh||"—")}</b> ${esc(j.cust)}<div class="k">${esc(j.desc)} · ${j.date}${j.status==="open"?" · ක්‍රියාත්මක":""}</div></div><div style="text-align:right"><b>${fmt(j.charged)}</b><div class="k ${b>0?"bad":"ok"}">${b>0?"ඉතුරු "+fmt(b):"ගෙවා ඇත"}</div><div class="k">ලාභ ${fmt(j.charged-cost(j.id))}</div></div></div>`}).join(""):'<div class="k">වැඩ නැත. + බොත්තමෙන් එකතු කරන්න.</div>'}
const vJobs=()=>`<div class="card"><input placeholder="වාහන අංකය / නම / දුරකථන සොයන්න" value="${esc(Q)}" oninput="Q=this.value;$('#jl').innerHTML=jobRows()"><button class="save" onclick="A.newJob()">+ අලුත් වැඩක්</button></div><div class="card" id="jl">${jobRows()}</div>`;

function vStaff(){return`<div class="card"><button class="save" style="margin:0" onclick="A.staff()">+ ස්ටාෆ් සාමාජිකයෙක්</button></div>`+mo()+staffStats().map(s=>`<div class="card"><div class="row" style="border:0;padding:0"><b onclick="A.staff('${s.id}')">${esc(s.name)}</b><span class="k">දිනකට ${fmt(s.rate)}</span></div><div class="grid" style="margin-top:8px"><div><div class="k">දින</div><div class="v">${s.days}</div></div><div><div class="k">ගෙවූ</div><div class="v">${fmt(s.mpaid)}</div></div><div><div class="k">${s.owed<0?"අත්තිකාරම්":"ඉතුරු"}</div><div class="v ${s.owed>0?"bad":"ok"}">${fmt(Math.abs(s.owed))}</div></div></div><div style="display:flex;gap:6px;margin-top:10px"><button class="chip" onclick="A.att('${s.id}')">පැමිණීම</button><button class="chip" onclick="A.spay('${s.id}')">ගෙවීම</button><button class="chip" onclick="A.sdet('${s.id}')">විස්තර</button></div></div>`).join("")}

const vExp=()=>`<div class="card"><button class="save" style="margin:0" onclick="A.exp()">+ වියදමක්</button></div>`+mo()+`<div class="card">`+(L("exp").filter(e=>inM(e.date)).sort(byNew).map(e=>`<div class="row" onclick="A.exp('${e.id}')" style="cursor:pointer"><div><b>${CATS[e.cat]}</b><div class="k">${e.date} ${esc((S.staff[e.staff]||{}).name||"")} ${esc(e.note)}</div></div><b class="bad">${fmt(e.amount)}</b></div>`).join("")||'<div class="k">මේ මාසයේ වියදම් නැත</div>')+"</div>";

function vMore(){const c={};L("jobs").forEach(j=>{const k=j.veh||j.phone||j.cust,o=c[k]||(c[k]={n:j.cust,v:j.veh,p:j.phone,t:0,b:0,c:0});o.t+=j.charged;o.b+=j.charged-paid(j);o.c++});
 const lim=new Date(Date.now()+14*864e5).toISOString().slice(0,10),sv=L("jobs").filter(j=>j.next&&j.next<=lim).sort((a,b)=>a.next.localeCompare(b.next));
 return`<div class="card"><h3>සර්විස් මතක් කිරීම (දින 14ක් ඇතුළත)</h3>`+(sv.map(j=>`<div class="row"><div><b>${esc(j.veh)}</b> ${esc(j.cust)}<div class="k">${j.next}</div></div><button class="chip" style="flex:none" onclick="A.wa('${j.id}','svc')">WhatsApp</button></div>`).join("")||'<div class="k">නැත</div>')+`</div>
